name: 部署

# 推到 main 就自動：測試 → 打包 → 部署到 Cloudflare（網址 https://urktv.<帳號>.workers.dev）
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 設兩個秘密（和 lotto-app 同一組即可）：
#   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# ★ 目前改成只手動觸發：網站現在由 deploy/deploy.py 直接部署（含歌庫檔案），
#   自動部署會用不含歌庫的版本蓋掉同名的 urktv。要恢復自動部署，先設好秘密並處理歌庫檔案的來源。
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: 測試
        run: npm test
      - name: 打包（dist/）
        run: npm run build
      - name: 檢查單檔大小（Cloudflare 上限 25MB）
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "超過 25MB：$big"; exit 1; fi
      - name: 部署到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "### ✅ 已上線：$URL" >> "$GITHUB_STEP_SUMMARY"

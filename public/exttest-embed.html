<!doctype html><html><body style="margin:0;background:#000">
<!-- Dev test only: stands in for a YouTube embed (this sandbox cannot reach YouTube). -->
<video id="v" src="bench/clip.mp3" style="width:100%;height:100%" playsinline></video>
<script>
  const v = document.getElementById('v');
  v.muted = new URLSearchParams(location.search).get('muted') === '1';
  const name = v.muted ? 'main' : 'lead';
  window.addEventListener('message', (e) => {
    const c = e.data && e.data.cmd;
    if (c === 'play') v.play().catch((err) => parent.postMessage({ frame: name, err: String(err) }, '*'));
    else if (c === 'pause') v.pause();
    else if (c === 'seek') v.currentTime = e.data.t;
    else if (c === 'mute') v.muted = !!e.data.on;
  });
  setInterval(() => parent.postMessage({ frame: name, id: new URLSearchParams(location.search).get('id'), t: v.currentTime, playing: !v.paused, ended: v.ended, dur: v.duration || 0 }, '*'), 100);
</script>
</body></html>

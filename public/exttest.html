<!doctype html><html><head><meta charset="utf-8"><title>extension test</title></head>
<body style="background:#111;color:#eee;font:14px sans-serif">
<!-- Dev test only: two players like the real stage (lead small, main muted), driven like the site does. -->
<iframe id="lead" allow="autoplay" src="http://127.0.0.1:4174/exttest-embed.html?muted=0" width="200" height="200"></iframe>
<iframe id="main" allow="autoplay" src="http://127.0.0.1:4174/exttest-embed.html?muted=1" width="480" height="270"></iframe>
<pre id="log"></pre>
<script>
  const log = (s) => (document.getElementById('log').textContent += s + '\n');
  window.statuses = [];
  window.addEventListener('message', (e) => {
    if (e.data && e.data.source === 'urktv-ext') { window.statuses.push(e.data); if (e.data.type === 'ready') log('extension ' + JSON.stringify(e.data)); }
  });
  const post = (m) => window.postMessage({ source: 'urktv-page', ...m }, location.origin);
  window.runTest = async (mode, lead) => {
    post({ type: 'consent', ok: true });
    post({ type: 'start', lead, vocal: 0, mode, modelUrl: location.origin + '/models/UVR_MDXNET_KARA_2.onnx', ortBase: '', model: 'kara2' });
    const L = document.getElementById('lead').contentWindow, M = document.getElementById('main').contentWindow;
    let mt = 0, mp = false;
    window.addEventListener('message', (e) => { if (e.data && e.data.frame === 'main') { mt = e.data.t; mp = e.data.playing; } });
    L.postMessage({ cmd: 'play' }, '*');
    setTimeout(() => M.postMessage({ cmd: 'play' }, '*'), lead * 1000);
    setInterval(() => post({ type: 'clock', t: mt, playing: mp }), 200);
  };
  post({ type: 'hello' });
</script>
</body></html>
